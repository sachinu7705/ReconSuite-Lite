<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DNS Intelligence | ReconSuite Lite</title>
  <link rel="stylesheet" href="/dns.css">
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand">R <span>ReconSuite Lite</span></a>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/whois">WHOIS Lookup</a>
    </nav>
  </header>

  <main class="container">
    <div class="heading">
      <div>
        <p class="eyebrow">NETWORK INTELLIGENCE</p>
        <h1>DNS Lookup</h1>
        <p>Discover and inspect public DNS records for a domain.</p>
      </div>
      <span class="status">● DNS API Ready</span>
    </div>

    <section class="search-card">
      <form id="dnsForm">
        <label for="domain">Domain name</label>
        <div class="search-row">
          <input id="domain" placeholder="example.com" value="google.com" required>
          <button id="lookupBtn" type="submit">Lookup DNS</button>
        </div>
      </form>

      <div class="record-types">
        <span>A</span><span>AAAA</span><span>MX</span>
        <span>NS</span><span>TXT</span><span>CNAME</span><span>SOA</span>
      </div>
    </section>

    <div id="message">Enter a domain to begin DNS lookup.</div>

    <section id="summary" class="summary hidden"></section>

    <section class="results-card">
      <div class="results-heading">
        <h2>DNS Records</h2>
        <button id="exportBtn" class="secondary" disabled>Export PDF</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Type</th><th>Value</th><th>TTL</th><th>Action</th></tr>
          </thead>
          <tbody id="results">
            <tr><td colspan="4">No records loaded yet.</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/dns.js"></script>
</body>
</html>
